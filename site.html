<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #4f46e5, #7c3aed);
		}
		.login-card {
			width: min(90%, 380px);
			padding: 2rem;
			border-radius: 12px;
			background: #fff;
			box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
		}
		h1 { margin: 0 0 1.5rem; text-align: center; color: #222; }
		label { display: block; margin: 1rem 0 .4rem; color: #444; }
		input {
			width: 100%;
			padding: .8rem;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #4f46e5; border-color: transparent; }
		button {
			width: 100%;
			margin-top: 1.5rem;
			padding: .85rem;
			border: 0;
			border-radius: 6px;
			color: #fff;
			background: #4f46e5;
			font-size: 1rem;
			cursor: pointer;
		}
		button:hover { background: #4338ca; }
		.forgot { display: block; margin-top: 1rem; text-align: center; color: #4f46e5; text-decoration: none; }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Entrar</h1>
		<form>
			<label for="email">E-mail</label>
			<input type="email" id="email" name="email" placeholder="seu@email.com" required>

			<label for="password">Senha</label>
			<input type="password" id="password" name="password" placeholder="Digite sua senha" required>

			<button type="submit">Entrar</button>
			<a class="forgot" href="#">Esqueci minha senha</a>
		</form>
	</main>
</body>
</html>
