<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Galeria de Bixinhos</title>
	<style>
		:root {
			--rosa: #ff7f9f;
			--rosa-claro: #fff1f5;
			--texto: #44333a;
			--branco: #fff;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			color: var(--texto);
			background: linear-gradient(135deg, #fff8fa, #f8f1ff);
		}

		header { text-align: center; padding: 58px 20px 38px; }
		header h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 6vw, 4.5rem); color: var(--rosa); }
		header p { margin: 0; font-size: 1.1rem; }

		nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 20px 35px; }
		nav a {
			color: var(--rosa); background: var(--branco); text-decoration: none;
			padding: 10px 18px; border-radius: 24px; font-weight: bold;
			box-shadow: 0 3px 12px #e8dbe0;
		}
		nav a:hover { background: var(--rosa); color: var(--branco); }

		main { max-width: 1180px; margin: auto; padding: 0 20px 50px; }
		.galeria {
			display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
			gap: 22px;
		}
		figure {
			margin: 0; overflow: hidden; background: var(--branco); border-radius: 18px;
			box-shadow: 0 8px 22px #e4dce1; transition: transform .25s ease;
		}
		figure:hover { transform: translateY(-7px) rotate(1deg); }
		figure img { display: block; width: 100%; height: 245px; object-fit: cover; }
		figcaption { padding: 16px 18px; font-size: 1.05rem; font-weight: bold; }
		figcaption span { float: right; color: var(--rosa); }
		footer { padding: 25px; text-align: center; background: var(--rosa-claro); color: #86636e; }
	</style>
</head>
<body>
	<header>
		<h1>🐾 Galeria de Bixinhos</h1>
		<p>Um cantinho cheio de fofura para alegrar o seu dia!</p>
	</header>

	<nav aria-label="Navegação principal">
		<a href="#todos">Todos</a>
		<a href="#gatos">Gatinhos</a>
		<a href="#caes">Cachorrinhos</a>
		<a href="#outros">Outros amigos</a>
	</nav>

	<main id="todos">
		<section class="galeria" aria-label="Fotos de animais fofos">
			<figure id="gatos"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=700&q=80" alt="Gato olhando para a câmera" loading="lazy"><figcaption>Olhar de curiosidade <span>🐱</span></figcaption></figure>
			<figure id="caes"><img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=700&q=80" alt="Cachorro sorrindo" loading="lazy"><figcaption>Melhor amigo <span>🐶</span></figcaption></figure>
			<figure><img src="https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?auto=format&fit=crop&w=700&q=80" alt="Coelho fofo" loading="lazy"><figcaption>Orelhinhas adoráveis <span>🐰</span></figcaption></figure>
			<figure><img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=700&q=80" alt="Leão descansando" loading="lazy"><figcaption>Rei da soneca <span>🦁</span></figcaption></figure>
			<figure id="outros"><img src="https://images.unsplash.com/photo-1560807707-8cc77767d783?auto=format&fit=crop&w=700&q=80" alt="Cachorro com a língua para fora" loading="lazy"><figcaption>Dia de diversão <span>🐕</span></figcaption></figure>
			<figure><img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=700&q=80" alt="Gato deitado" loading="lazy"><figcaption>Momento relax <span>💖</span></figcaption></figure>
		</section>
	</main>

	<footer>Feito com carinho para quem ama animais 🐾</footer>
</body>
</html>
