<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Meu Site</title>
	<style>
		:root { color-scheme: light dark; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f4f6f8;
			color: #1f2933;
		}
		main {
			max-width: 760px;
			margin: 0 auto;
			padding: 64px 24px;
			text-align: center;
		}
		.card {
			padding: 40px 24px;
			border-radius: 16px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
		}
		h1 { margin-top: 0; color: #2563eb; }
		p { line-height: 1.6; }
		a {
			display: inline-block;
			margin-top: 16px;
			padding: 12px 20px;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			text-decoration: none;
		}
		a:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main>
		<section class="card">
			<h1>Bem-vindo ao Meu Site</h1>
			<p>Esta página foi adicionada para complementar o projeto e servir como uma apresentação inicial.</p>
			<a href="#sobre">Saiba mais</a>
		</section>

		<section id="sobre">
			<h2>Sobre o projeto</h2>
			<p>Use este espaço       para apresentar o objetivo, as funcionalidades e os próximos passos do site.</p>
		</section>
	</main>
</body>
</html>
